# Dokploy: Compose service, provider "Raw", paste this file.
# The image is built straight from the public GitHub repo, so no git provider is needed in Dokploy.
# Create the service as Raw from the start: switching an existing git-based service to Raw puts
# .env in the wrong folder and ADMIN_PASSWORD is never set (Dokploy issue #2777).
#
# Dokploy settings:
#   Environment tab:  ADMIN_PASSWORD=<something long>
#   Domains tab:      your domain -> service "oksidas", port 8080, HTTPS on
# Redeploy pulls the latest commit of main. Pin a tag/commit by changing "#main".
#
# Data lives in the "rsvp-data" volume. Backup:
#   docker cp $(docker ps -qf name=oksidas):/data/rsvp.db ./rsvp-backup.db
services:
  oksidas:
    build: https://github.com/void9hq/event-oksidas.git#main
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      BASE_COUNT: "17" # registrations collected before the site went live
      # empty = /admin disabled (503), the site itself still works
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # client IP for rate limiting: Cloudflare -> Dokploy's Traefik -> this container.
      # TRUST_PROXY reads the peer Traefik saw; TRUST_CLOUDFLARE then takes CF-Connecting-IP,
      # but only if that peer is a Cloudflare edge.
      TRUST_PROXY: "1"
      TRUST_CLOUDFLARE: "1"
    volumes:
      - rsvp-data:/data

volumes:
  rsvp-data:
